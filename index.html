<!DOCTYPE html>
<html>
  <head>
    <title>KE ZCC Test Page</title>
    <style>
      h1 {
        color: #ff5c8d;
      }
      .todo {
        text-decoration: line-through;
        color: #999;
      }
      .todo::after {
        content: " (not ready)";
        font-style: italic;
        color: #c00;
        text-decoration: none;
      }
      .bethany a {
        color: #8e44ad;
        font-weight: bold;
        text-decoration: none;
        background: #f3e5f5;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .bethany a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>KE ZCC Test Page</h1>
    <ul>
      <li><a href="video.html">Schedule a video call</a></li>
      <li><a href="voice.html">Schedule a voice call</a></li>
      <li class="todo">Both options</li>
      <li class="bethany">🧪 <a href="bethanytest.html">Bethany test campaign</a></li>
    </ul>
    
    <script>
      const sparkles = ['✨', '⭐', '💫', '🌟'];

      function createSparkle() {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
        sparkle.style.left = Math.random() * 100 + 'vw';
        sparkle.style.animationDuration = (Math.random() * 3 + 3) + 's';
        sparkle.style.fontSize = (Math.random() * 15 + 15) + 'px';
        document.body.appendChild(sparkle);

        // Clean up after the animation finishes
        setTimeout(() => sparkle.remove(), 6000);
      }

      setInterval(createSparkle, 350);
    </script>
  </body>
</html>
